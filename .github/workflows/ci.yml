name: CEN4802 Continuous Integration

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run unit tests
        run: mvn -B clean package

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: cen4802-war
          path: target/*.war

      - name: Build Docker image
        run: docker build -t cen4802-app:latest -t cen4802-app:${{ github.sha }} .

      - name: Save Docker image
        run: docker save cen4802-app:latest cen4802-app:${{ github.sha }} -o cen4802-app.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: cen4802-docker-image
          path: cen4802-app.tar